<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéQuiz - Le Jeu du Film Quotidien</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --green: #22c55e;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #334155;
            color: var(--text-muted);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Style du jeu */
        .game-image-container {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #000;
            position: relative;
        }

        .game-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.5s ease;
        }

        .clues-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            border-left: 4px solid var(--accent-color);
        }

        .clues-box p {
            margin-bottom: 6px;
        }

        .music-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .music-btn:hover {
            opacity: 0.9;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
        }

        button.action-btn {
            padding: 12px 20px;
            background: var(--accent-color);
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            color: #000;
        }

        button.action-btn:hover {
            opacity: 0.9;
        }

        .guesses-history {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .guess-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .guess-dot.correct { background: var(--green); color: #fff; }
        .guess-dot.wrong { background: var(--red); color: #fff; }

        .message-box {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            min-height: 24px;
        }

        /* Section Boutique / Affiliation */
        .shop-item {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shop-item div h4 {
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .shop-item div p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .aff-btn {
            background: #2563eb;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 CinéQuiz</h1>
        <p class="subtitle">Le défi quotidien des cinéphiles</p>
    </header>

    <div class="container">
        <!-- Boutons de navigation -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('game')">Jeu du Jour</button>
            <button class="tab-btn" onclick="switchTab('shop')">Boutique & Geek</button>
        </div>

        <!-- SECTION 1 : JEU DU JOUR -->
        <div id="game-section" class="section active">
            <div class="game-image-container">
                <img id="movie-img" src="" alt="Film mystère" style="filter: blur(25px);">
            </div>

            <div class="guesses-history" id="guesses-history">
                <div class="guess-dot">1</div>
                <div class="guess-dot">2</div>
                <div class="guess-dot">3</div>
                <div class="guess-dot">4</div>
                <div class="guess-dot">5</div>
            </div>

            <div class="clues-box" id="clues-box">
                <p><strong>🎭 Indice 1 (Genre) :</strong> <span id="clue-genre">...</span></p>
                <p><strong>📅 Indice 2 (Année) :</strong> <span id="clue-year">...</span></p>
                <p><strong>💬 Indice 3 (Réplique culte) :</strong> <span id="clue-quote">...</span></p>
                <button class="music-btn" onclick="playThemeSong()">🎵 Écouter un extrait musical</button>
            </div>

            <div id="game-controls">
                <div class="input-group">
                    <input type="text" id="user-guess" placeholder="Titre du film ou de la série..." onkeypress="handleKeyPress(event)">
                    <button class="action-btn" onclick="makeGuess()">Valider</button>
                </div>
            </div>

            <div class="message-box" id="message-box"></div>
        </div>

        <!-- SECTION 2 : BOUTIQUE / AFFILIATION -->
        <div id="shop-section" class="section">
            <h3 style="margin-bottom: 15px; font-size: 1.1rem; color: var(--accent-color);">Le Coin du Collectionneur</h3>
            
            <div class="shop-item">
                <div>
                    <h4>Affiche Minimaliste Culte</h4>
                    <p>Posters de films haute qualité</p>
                </div>
                <a href="https://www.amazon.fr/s?k=affiche+film+culte" target="_blank" class="aff-btn">Voir</a>
            </div>

            <div class="shop-item">
                <div>
                    <h4>Coffret Blu-ray Collector</h4>
                    <p>Éditions limitées et steelbooks</p>
                </div>
